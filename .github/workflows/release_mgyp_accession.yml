---
name: Release mgyp-accession image

on:  # yamllint disable-line rule:truthy
  workflow_run:
    workflows: [Testing]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and push the mgyp-accession image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # The assembly analysis pipeline pins this tag, so it must never be reused for other code.
      - name: Tag with the emgapi-v2 version and the commit
        id: tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          echo "tag=${version}-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.mgyp-accession
          build-args: VERSION=${{ steps.tag.outputs.tag }}
          push: true
          tags: quay.io/microbiome-informatics/mgyp-accession:${{ steps.tag.outputs.tag }}
